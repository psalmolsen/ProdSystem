name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify service account secret
        shell: bash
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e '
            let j;
            try {
              j = JSON.parse(process.env.SA_JSON);
            } catch (e) {
              console.error("FIREBASE_SERVICE_ACCOUNT is not valid JSON:", e.message);
              process.exit(1);
            }
            console.log("project_id: " + j.project_id);
            console.log("client_email: " + j.client_email);
            console.log("private_key present: " + !!j.private_key);
            console.log("type: " + j.type);
            if (j.project_id !== "prodsystem-488bf") {
              console.error("ERROR: secret belongs to project " + j.project_id + " but workflow expects prodsystem-488bf");
              process.exit(1);
            }
            if (!j.private_key) {
              console.error("ERROR: secret has no private_key field");
              process.exit(1);
            }
            console.log("Secret OK - matches prodsystem-488bf");
          '

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project prodsystem-488bf --non-interactive
