name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Verify FIREBASE_SERVICE_ACCOUNT Secret
        shell: bash
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e '
            let j;
            try {
              j = JSON.parse(process.env.SA_JSON);
            } catch (e) {
              console.error("❌ FIREBASE_SERVICE_ACCOUNT is NOT valid JSON");
              console.error(e.message);
              process.exit(1);
            }

            console.log("========== SERVICE ACCOUNT ==========");
            console.log("project_id:", j.project_id);
            console.log("client_email:", j.client_email);
            console.log("type:", j.type);
            console.log("private_key exists:", !!j.private_key);

            if (!j.private_key) {
              console.error("❌ private_key is missing.");
              process.exit(1);
            }

            if (j.project_id !== "prodsystem-488bf") {
              console.error("❌ Wrong Firebase project.");
              console.error("Expected: prodsystem-488bf");
              console.error("Actual:   " + j.project_id);
              process.exit(1);
            }

            console.log("✅ Service account JSON is valid.");
          '

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase Authentication
        run: |
          firebase --version
          firebase projects:list

      - name: Verify Firebase Project Access
        run: |
          firebase use prodsystem-488bf
          firebase target:apply hosting default prodsystem-488bf || true

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy \
            --only hosting \
            --project prodsystem-488bf \
            --non-interactive \
            --debug